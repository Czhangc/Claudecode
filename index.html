<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 Story Time for Kids</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="main-title">
                <span class="emoji-bounce">📚</span>
                Story Time
                <span class="emoji-bounce">✨</span>
            </h1>
            <p class="subtitle">Choose your adventure!</p>
        </header>

        <!-- Story Library -->
        <div class="story-grid">
            <!-- Story 1: The Magic Garden -->
            <div class="story-card" onclick="openStory('magic-garden')">
                <div class="story-icon">🌸</div>
                <h2 class="story-title">The Magic Garden</h2>
                <p class="story-description">Interactive & Musical</p>
                <div class="stars">⭐⭐⭐</div>
            </div>

            <!-- Story 2: Space Adventure -->
            <div class="story-card" onclick="openStory('space-adventure')">
                <div class="story-icon">🚀</div>
                <h2 class="story-title">Space Adventure</h2>
                <p class="story-description">Animated Journey</p>
                <div class="stars">⭐⭐⭐</div>
            </div>

            <!-- Story 3: Ocean Friends -->
            <div class="story-card" onclick="openStory('ocean-friends')">
                <div class="story-icon">🐠</div>
                <h2 class="story-title">Ocean Friends</h2>
                <p class="story-description">Interactive Fun</p>
                <div class="stars">⭐⭐⭐</div>
            </div>

            <!-- Story 4: Forest Animals -->
            <div class="story-card" onclick="openStory('forest-animals')">
                <div class="story-icon">🦊</div>
                <h2 class="story-title">Forest Friends</h2>
                <p class="story-description">Musical Tale</p>
                <div class="stars">⭐⭐⭐</div>
            </div>

            <!-- Story 5: Rainbow Kingdom -->
            <div class="story-card" onclick="openStory('rainbow-kingdom')">
                <div class="story-icon">🌈</div>
                <h2 class="story-title">Rainbow Kingdom</h2>
                <p class="story-description">Colorful Adventure</p>
                <div class="stars">⭐⭐⭐</div>
            </div>

            <!-- Story 6: Dinosaur Day -->
            <div class="story-card" onclick="openStory('dinosaur-day')">
                <div class="story-icon">🦕</div>
                <h2 class="story-title">Dinosaur Day</h2>
                <p class="story-description">Prehistoric Fun</p>
                <div class="stars">⭐⭐⭐</div>
            </div>
        </div>

        <!-- Audio Toggle -->
        <div class="audio-control">
            <button class="audio-btn" onclick="toggleMusic()">
                <span id="music-icon">🔊</span>
                <span id="music-text">Music On</span>
            </button>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="audio/background.mp3" type="audio/mpeg">
    </audio>

    <script src="app.js"></script>
</body>
</html>
