<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5543a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Social Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Social Gym · 社交觉察训练</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2622;--mute:#7a7068;--line:#e6dfd4;--accent:#b5543a;--accent2:#3f6b5e;--soft:#f1ebe0}
@media(prefers-color-scheme:dark){:root{--bg:#1b1917;--card:#252220;--ink:#efe9e1;--mute:#a39a90;--line:#3a3530;--accent:#e08566;--accent2:#7fb5a3;--soft:#2e2a26}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;color:var(--accent);text-decoration:none;letter-spacing:.5px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:4px 10px;border-radius:999px;color:var(--mute);text-decoration:none;font-size:14px}
nav a.on{background:var(--soft);color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:26px;margin:.6em 0 .3em}h2{font-size:19px;margin:1.6em 0 .5em}h3{font-size:16px;margin:1em 0 .4em}
.lead{color:var(--mute)}.muted{color:var(--mute);font-size:14px}
a{color:var(--accent2)}
.back{font-size:14px;text-decoration:none}
.grid{display:grid;gap:12px}
.card,.panel{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;color:inherit;text-decoration:none}
.grid .card{margin:0}
.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 4px;font-size:17px}.card p{margin:0 0 8px;color:var(--mute);font-size:14px}
.setup{background:var(--soft)}
.tags,.chips,.row,.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row{justify-content:space-between}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--mute);border:1px solid var(--line)}
.tag.alt{color:var(--accent2)}.tag.cx1{color:#4b8a4b}.tag.cx2{color:#a67c00}.tag.cx3{color:var(--accent)}.tag.done{color:var(--accent2)}
.btn{display:inline-block;margin:8px 0;padding:9px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:3px 12px;margin:4px 0;font-size:14px;background:transparent;color:var(--accent)}
.btn.small.on{background:var(--accent2);border-color:var(--accent2);color:#fff}.btn.small.on.miss{background:var(--accent);border-color:var(--accent);}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.danger{color:var(--accent)}
.chip{padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
input,textarea,select{width:100%;padding:9px 10px;margin:4px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
label{display:block;font-size:14px;color:var(--mute)}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink)}.chk input{width:auto;margin:0}
.filters select{width:auto;max-width:100%;margin:0 0 8px}.filters .btn.small{margin:0 0 8px}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:12px 0;font-size:13px;flex-wrap:wrap}
.steps li{padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--mute)}
.steps li.on{background:var(--accent);color:#fff}.steps li.done{color:var(--accent2)}
.tl .beat{padding:8px 12px;margin:6px 0;border-left:3px solid var(--accent2);background:var(--card);border-radius:0 8px 8px 0}
.tl em{display:block;font-size:13px;color:var(--mute);font-style:normal}
.timer{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:12px 0 4px}.timer i{display:block;height:100%;width:100%;background:var(--accent)}
blockquote{margin:6px 0;padding:8px 12px;border-left:3px solid var(--accent2);background:var(--soft);border-radius:0 8px 8px 0}
blockquote.say{font-size:17px}blockquote cite{display:block;font-size:12px;color:var(--mute);font-style:normal}
.pit{border-left:3px solid var(--accent)}
.cmp{display:grid;gap:12px}@media(min-width:640px){.cmp{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}
.bar{display:grid;grid-template-columns:110px 1fr 52px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bt{background:var(--soft);height:10px;border-radius:5px;overflow:hidden}.bt i{display:block;height:100%;background:var(--accent2)}
.bn{color:var(--mute);text-align:right}
@media(max-width:480px){.bar{grid-template-columns:80px 1fr 44px}}

.err{color:var(--accent);font-size:14px}.ai{border-left:3px solid var(--accent2)}.ai ul{margin:.3em 0 .8em;padding-left:1.2em}

</style>
</head>

<script>
// 词表：信号类型、autopilot 模式、老手回应机制、领域与专题（zh/en）
window.TAX = {
  domains: {
    work:   { zh: '职场', en: 'Work' },
    close:  { zh: '日常/亲密', en: 'Close relationships' },
    public: { zh: '陌生人/大场合', en: 'Strangers & events' },
    read:   { zh: '读懂他人/复杂局面', en: 'Reading complex situations' }
  },
  topics: {
    awkward: { zh: '化解尴尬', en: 'Defusing awkwardness' },
    provoke: { zh: '应对挑衅/贬低', en: 'Handling provocation' },
    power:   { zh: '权力与面子', en: 'Power & face' },
    intimacy:{ zh: '亲密关系', en: 'Intimacy' },
    event:   { zh: '大场合', en: 'Social events' },
    read:    { zh: '读懂局面', en: 'Reading the room' }
  },
  layers: {
    tone:     { zh: '语气层', en: 'Tone' },
    relation: { zh: '关系层', en: 'Relationship' },
    power:    { zh: '权力层', en: 'Power' },
    subtext:  { zh: '潜台词层', en: 'Subtext' }
  },
  signals: {
    timing:   { zh: '时机/停顿/延迟', en: 'Timing & pauses' },
    wording:  { zh: '措辞/标点变化', en: 'Wording & punctuation' },
    tone:     { zh: '语气/音量', en: 'Tone of voice' },
    body:     { zh: '肢体/表情', en: 'Body & face' },
    audience: { zh: '旁人反应', en: 'Audience reaction' },
    power:    { zh: '地位/权力', en: 'Status & power' },
    face:     { zh: '面子', en: 'Face / dignity' },
    unsaid:   { zh: '没说出口的', en: 'What is unsaid' },
    alliance: { zh: '结盟/站队', en: 'Alliances' },
    heat:     { zh: '情绪温度', en: 'Emotional heat' }
  },
  autopilot: {
    please:    { zh: '讨好', en: 'Pleasing' },
    defend:    { zh: '防御/辩解', en: 'Defending' },
    overexplain:{ zh: '过度解释', en: 'Over-explaining' },
    withdraw:  { zh: '沉默/回避', en: 'Withdrawing' },
    fix:       { zh: '急于解决', en: 'Rushing to fix' },
    counter:   { zh: '反击', en: 'Counter-attacking' },
    lecture:   { zh: '说教', en: 'Lecturing' },
    jokecover: { zh: '玩笑掩饰', en: 'Joking it off' },
    freeze:    { zh: '僵住/大脑空白', en: 'Freezing' }
  },
  mechanisms: {
    humor:    { zh: '幽默/自嘲降温', en: 'Humor & self-deprecation',
                def: '用轻松的方式承认或放大尴尬，让紧张释放，同时显示你不被它控制。例：“我这波属于现场翻车教学。”' },
    nameFact: { zh: '命名事实，不加指控', en: 'Name the fact, no accusation',
                def: '平静地描述发生了什么，不判断对方动机。例：“我注意到这是第三次被打断。”' },
    reframe:  { zh: '善意重述', en: 'Generous reframe',
                def: '把对方的话按最善意（或最中性）的版本复述，既给台阶又把对话拉回正轨。' },
    tossBack: { zh: '轻轻抛回', en: 'Toss it back',
                def: '把话题/责任以不带火药味的方式还给对方，例：“这个问题挺好，你怎么看？”' },
    curious:  { zh: '好奇追问', en: 'Curious question',
                def: '用真诚的好奇去问“这话怎么说？”，让对方自己面对话里的分量。' },
    slow:     { zh: '慢速与沉默', en: 'Slow down & silence',
                def: '放慢语速、停顿半拍。节奏不被对方带走，本身就是信号。' },
    redirect: { zh: '转移焦点', en: 'Redirect',
                def: '自然地把话题引向更有建设性或更安全的方向。' },
    boundary: { zh: '设边界，不开战', en: 'Boundary without war',
                def: '清楚表达“这个我不聊/不接受”，语气平稳，不附带反击。' },
    saveFace: { zh: '给台阶', en: 'Save face',
                def: '帮对方（或自己）体面地下台——不让任何人当众丢脸，通常能换来长期好感。' },
    delay:    { zh: '延迟回应', en: 'Delay',
                def: '“我想一下，稍后回你。”把即时反应变成设计后的回应。' },
    askBack:  { zh: '以问代答', en: 'Answer with a question',
                def: '用问题化解陷阱问题，同时获取信息，例：“你为什么这么问？”' },
    probe:    { zh: '低成本验证假设', en: 'Cheap probe of a hypothesis',
                def: '不急着下结论或行动：先列出几种可能的解释，再用一个小问题或小动作试探，用对方的反应来校正判断。例：“我想确认一下，这周的节奏你是不是有点吃紧？”' },
    partial:  { zh: '有限同意', en: 'Acknowledge, not concede',
                def: '承认对方话里站得住的部分，但不接受整体框架：“这点你说得对，不过……”' }
  }
};

;
// 场景库。字符串 = 仅中文；{zh,en} = 双语。缺少 en 时自动回退中文。
// timeline: [谁, 内容, 补充线索(时机/语气/肢体)]
// signals: {id,type(见 TAX.signals),layer(见 TAX.layers),beat(timeline 序号),text}
// veteran: 老手回应 {say, mech[], why, limits, delivery}；pitfalls: 容易翻车的回应
window.SCENARIOS = [];
(function () {
  const S = (o) => window.SCENARIOS.push(o);

  /* ================= 化解尴尬 ================= */
  S({ id: 'a1', domain: 'work', topic: 'awkward', dims: { parties: 1, subtext: 1, power: 2, heat: 1 },
    title: { zh: '电梯里的冷场', en: 'Silence in the elevator' },
    setup: { zh: '早上电梯里只有你和不太熟的部门总监。电梯上行，空气安静。', en: 'Just you and a director you barely know in the elevator. It is silent.' },
    timeline: [
      ['总监', '（低头看手机，抬头与你对视一秒）', '微微点头，没说话'],
      ['总监', '（又低头）', '电梯已过了 3 层，没人开口'],
      ['总监', '“……今天挺冷的。”', '声音很轻，没看你']
    ],
    prompt: '你怎么回应？',
    signals: [
      { id: 'a1s1', type: 'body', layer: 'relation', beat: 0, text: '对视后点头 = 认可你的存在，是开放而非拒绝的信号，只是没有动力主动开启。' },
      { id: 'a1s2', type: 'timing', layer: 'subtext', beat: 1, text: '沉默过了好几层才开口：对方也在“要不要说话”里犹豫，尴尬是双向的。' },
      { id: 'a1s3', type: 'wording', layer: 'tone', beat: 2, text: '“今天挺冷的”是低风险的“搭桥句”——不需要深入回答，只需要一个回应来确认彼此。' },
      { id: 'a1s4', type: 'power', layer: 'power', beat: 2, text: '地位高的人先出了手，你给出的回应会被记住的往往不是内容，而是温度。' }
    ],
    veteran: [
      { say: { zh: '“是啊，早上一出门我就后悔没加外套。您是不是也是被天气骗了？”', en: '“Right? I regretted not bringing a coat. Did the weather fool you too?”' }, mech: ['partial', 'humor'], why: '接住搭桥句，加一点自我暴露和轻松感，并留一个很容易回答的小钩子。', limits: '对方很赶时间、明显不想聊时不要追问。', delivery: '语速自然，微笑，半句话收尾，不要拖长。' },
      { say: { zh: '“对，这两天降温特别明显。您周末有没有躲在家里？”', en: '“Yes, it dropped fast. Did you hide at home this weekend?”' }, mech: ['redirect'], why: '把天气转到轻松的个人话题，成本低，便于对方延续或礼貌结束。', limits: '对象明显偏私密或严肃时，换更中性话题。', delivery: '问完就停，接受对方“嗯”一声的结束。' },
      { say: { zh: '“嗯，是挺冷。”（微笑点头，不再追加）', en: '“Yeah, it is cold.” (smile, nod, stop)' }, mech: ['slow'], why: '不是每次都要“多说”。礼貌承接+舒服的沉默，同样体面。', limits: '如果你想建立关系，这个回应过于保守。', delivery: '眼神温和，不要低头看手机以免显得冷漠。' }
    ],
    pitfalls: [{ say: '“是啊是啊，真的好冷好冷！我昨天……（连讲一分钟）”', cost: '用力过猛：对方只想要一个轻量互动，被迫承受过多信息反而更尴尬。' }]
  });

  S({ id: 'a2', domain: 'public', topic: 'awkward', dims: { parties: 3, subtext: 2, power: 1, heat: 2 },
    title: { zh: '说错话的那一秒', en: 'The slip of the tongue' },
    setup: { zh: '饭局上你随口说：“你们公司不是最近在裁员吗？”桌上突然安静，对方是刚入职的新同事。', en: 'At dinner you blurt out, “Isn’t your company laying people off?” The table goes quiet; the person was just hired.' },
    timeline: [
      ['新同事', '“……啊，也不算吧。”', '笑容僵了一下，眼神移向杯子'],
      ['旁人', '（互相看了一眼）', '一个人开始低头夹菜'],
      ['新同事', '“反正我们组还好。”', '语速变快']
    ],
    prompt: '你怎么收场？',
    signals: [
      { id: 'a2s1', type: 'body', layer: 'tone', beat: 0, text: '笑容僵、眼神回避：话触到了敏感点，对方正努力保持体面。' },
      { id: 'a2s2', type: 'audience', layer: 'relation', beat: 1, text: '旁人互看+夹菜：全桌在等你如何处理，同时也在回避让当事人更难堪。' },
      { id: 'a2s3', type: 'timing', layer: 'subtext', beat: 2, text: '语速突然变快：在转移尴尬，也说明想快点结束这个话题。' },
      { id: 'a2s4', type: 'face', layer: 'relation', beat: 0, text: '“也不算吧”是在留面子。你若继续追问，会逼他在多人面前继续解释。' }
    ],
    veteran: [
      { say: { zh: '“哎，我这嘴快过脑子了，不该在饭桌上聊这个。来，我敬你一杯，欢迎加入！”', en: '“My mouth outran my brain — wrong topic for dinner. Here’s to you, welcome aboard!”' }, mech: ['humor', 'saveFace'], why: '一句话完成：承认失误（自嘲）+ 立即给对方台阶 + 切换到正向的欢迎。', limits: '如果对方真有裁员焦虑，之后私下可以补一句关心。', delivery: '诚恳但不沉重，语速稍快后立即举杯，结束话题。' },
      { say: { zh: '“抱歉，刚才说得太随便了。你们最近是不是项目挺多？” ', en: '“Sorry, that was careless. Busy projects lately?”' }, mech: ['nameFact', 'redirect'], why: '简短道歉不拖泥带水，随即把话题引到对方更舒服的方向。', limits: '不要在道歉后再加解释，会让事情更重。', delivery: '看着对方说抱歉，然后自然环视全桌，让话题流动。' },
      { say: { zh: '（饭后私下）“刚才我那句话有点冒失，希望没让你不舒服。”', en: '(afterwards, privately) “That was clumsy of me — hope I didn’t make it awkward.”' }, mech: ['saveFace'], why: '私下补救比当众反复道歉更有诚意，也不再次吸引注意力。', limits: '只说一次，不要变成反复要求对方安慰你。', delivery: '简短、不要求对方回应。' }
    ],
    pitfalls: [
      { say: '“不是不是，我就是听说的，你别介意啊，我真的不是那个意思……（连续解释）”', cost: '过度解释会把注意力钉在尴尬上，也把安抚对方的责任转给了对方。' },
      { say: '“哈哈开玩笑啦！”', cost: '用玩笑抹掉事实，对方会觉得自己的感受被无视。' }
    ]
  });

  S({ id: 'a3', domain: 'public', topic: 'awkward', dims: { parties: 4, subtext: 2, power: 1, heat: 1 },
    title: { zh: '插不进去的圈子', en: 'Outside the circle' },
    setup: { zh: '聚会上有四个人聊得热火朝天，你站在边上端着杯子，已经三分钟没人看你。', en: 'Four people are deep in a lively chat; you stand holding a drink and nobody has looked at you for three minutes.' },
    timeline: [
      ['圈内A', '“上次那家店你们记得吗，那个老板……”', '身体朝向圈内，背对你一侧'],
      ['圈内B', '“哈哈哈对对对！”', '圈子很紧凑，没有留缺口'],
      ['圈内C', '（瞥了你一眼，又转回去）', '短暂，未微笑']
    ],
    prompt: '你怎么做？',
    signals: [
      { id: 'a3s1', type: 'body', layer: 'relation', beat: 0, text: '站位封闭、背对：这是“内部话题模式”，不是排斥你，而是话题太专属。' },
      { id: 'a3s2', type: 'body', layer: 'relation', beat: 2, text: 'C 的一瞥是“开门”的最小信号——他意识到你的存在，是最容易接入的人。' },
      { id: 'a3s3', type: 'wording', layer: 'subtext', beat: 0, text: '话题依赖共同回忆（那家店）。直接插话很难，先从“好奇提问”进入更自然。' },
      { id: 'a3s4', type: 'unsaid', layer: 'subtext', beat: 1, text: '没人刻意不让你加入，也没人替你开口。需要你自己制造低成本入口。' }
    ],
    veteran: [
      { say: { zh: '（靠近 C，笑着）“我完全不在状况内，你们说的那家店，到底有什么传说？”', en: '(to C, smiling) “I’m totally out of the loop — what’s the legend of that place?”' }, mech: ['curious', 'humor'], why: '承认“不在状况”让别人愿意补背景，你从旁观者变成“被科普的对象”，自然进圈。', limits: '问完要真正听；不能每次都做新手角色。', delivery: '先对 C 点头微笑，稍等一个话尾再开口，不抢话。' },

  S({ id: 'p6', domain: 'work', topic: 'provoke', dims: { parties: 5, subtext: 2, power: 2, heat: 2 },

      { say: { zh: '“我注意到这是第三次我们的话撞在一起了，我先说完这一块，然后你补充，好吗？”', en: '“I notice this is the third time our points overlapped — let me finish this part, then you add?”' }, mech: ['nameFact', 'boundary'], why: '命名模式而不指责动机，直接而冷静。', limits: '避免用“你总是”之类的概括。', delivery: '语气平静。' },

      { say: { zh: '“收到，我确实没有做到您要的标准。能告诉我您最关注的是哪两点吗？我按这个重做。”', en: '“Received — I didn’t meet your standard. Which two points matter most to you? I’ll redo it accordingly.”' }, mech: ['partial', 'curious'], why: '认下事实、不自我贬低，同时把模糊的“差”转为具体的期待。', limits: '不要把“请指教”变成过度示弱。', delivery: '诚恳、不卑微。' },

      { say: { zh: '（会后向业务负责人）“刚才交付周期看起来是大家比较关心的点。方便的话，能不能约顾问老师单独聊 15 分钟，我把我们的交付保障方案讲清楚？”', en: '(to the business lead) “Delivery timing seems to matter. Could we have 15 minutes with the advisor to walk through our delivery assurance plan?”' }, mech: ['probe', 'redirect'], why: '把“内部再讨论”转化为一个具体的小请求，直接接触真正的评估者，针对他的顾虑给方案。', limits: '不要绕过采购经理做事，应征得业务负责人同意并同步给采购。', delivery: '尊重、清楚，强调这是为了让他们的讨论更有信息。' },
      { say: { zh: '（给采购经理）“价格上我们理解您的压力。我整理了一版按交付阶段付款的方案，可以降低您一次性投入的风险，供内部讨论参考。”', en: '(to procurement) “We understand the price pressure. Here is a milestone-based payment plan to lower upfront risk for your internal discussion.”' }, mech: ['partial', 'redirect'], why: '承认压价的合理性，同时给采购一个能向内部交代的“可用材料”，而不是继续在价格上拉扯。', limits: '方案要真实可执行，不要为了成交承诺做不到的事。', delivery: '专业、合作，不带防御。' },
      { say: { zh: '（三天后发一条）“想确认一下内部讨论的节点：如果有需要补充的材料，我们可以在周五前准备好。”', en: '(three days later) “Just checking on the internal timeline — if you need more material, we can prepare it by Friday.”' }, mech: ['delay', 'probe'], why: '用“补充材料”这个小口子保持推进，同时从回复速度和具体程度读到对方的真实意愿。', limits: '不要连续追问；一次跟进后根据反应调整。', delivery: '简短，不施压。' }
    ],
    pitfalls: [{ say: '“价格上我们可以再让一点，您看能不能今天就定下来？”', cost: '没有搞清真实的顾虑就让价，会削弱自己的立场，也解决不了顾问的交付疑虑。' }]
  });

  S({ id: 'r5', domain: 'read', topic: 'read', dims: { parties: 2, subtext: 3, power: 1, heat: 3 },
    title: { zh: '同事突然变冷淡', en: 'A colleague suddenly turns cold' },
    setup: { zh: '一周前你和同事小陈还会一起吃午饭、互相吐槽。这周起，他的回复变得很短，开会时也很少看你。你感到一点不安。', en: 'A week ago you and Chen had lunch together and joked around. This week his replies are short and he rarely looks at you in meetings. You feel uneasy.' },
    timeline: [
      ['小陈', '“好。”', '以前会回一大段加表情'],
      ['小陈', '（午饭时说“我带了饭，在工位吃”）', '这是本周第三次'],
      ['小陈', '（会上你发言时，他在看手机）', ''],
      ['小陈', '（走廊遇见，点点头就走了）', '但他和别的同事还在说笑']
    ],
    prompt: '这意味着什么？你在做任何反应前，会先怎么确认？',
    signals: [
      { id: 'r5s1', type: 'wording', layer: 'tone', beat: 0, text: '回复变短：和他“以前”的基线相比的变化，比单次内容更重要。' },
      { id: 'r5s2', type: 'timing', layer: 'relation', beat: 1, text: '连续三次避开共同午饭：不是偶然，但原因未知——可能是对你，也可能是他自己的状态。' },
      { id: 'r5s3', type: 'body', layer: 'tone', beat: 2, text: '会上看手机：可能是回避、也可能是他在处理自己的压力。单个行为不足以判断。' },
      { id: 'r5s4', type: 'audience', layer: 'relation', beat: 3, text: '和别的同事还在说笑：说明他不是整体情绪低落，变化更像是针对你或与你相关的事。' },
      { id: 'r5s5', type: 'heat', layer: 'subtext', beat: 0, text: '你自己的不安会放大“被针对”的解释。先把几种可能列出来，不要只接受最痛的那一种。' }
    ],
    veteran: [
      { say: { zh: '“最近感觉你有点忙，也可能是我哪里做得不对？如果有的话直接告诉我，我想把事情弄清楚。”', en: '“You seem busy lately — or did I do something off? If so, tell me directly; I’d like to clear it up.”' }, mech: ['probe', 'curious'], why: '同时承认“你忙”和“我可能有问题”两种假设，让对方可以选择更安全的那个来回答，而不是被逼问。', limits: '不要在公开场合问；对方说“没事”时不要追问第二次。', delivery: '私下、轻松、不带情绪压力，给对方留退路。' },
      { say: { zh: '（先写下三种可能：他自己有压力 / 我的某件事让他不舒服 / 他和别人有事影响了关系；然后观察一周）', en: '(write down three hypotheses first; observe for a week)' }, mech: ['slow', 'probe'], why: '把一个情绪反应变成几个可验证的假设，降低你被“最坏的那一种”带走的概率。', limits: '观察不等于回避；若影响到工作协作，需要主动沟通。', delivery: '继续保持正常、友好的互动，不要突然变冷淡。' },
      { say: { zh: '（小事上轻轻试探）“周五我想去楼下新开的那家，你有空一起吗？没空也没关系。”', en: '(a small probe) “I’m trying the new place downstairs on Friday — want to join? No worries if not.”' }, mech: ['probe', 'saveFace'], why: '用一个低成本、容易拒绝的邀请，从他的反应（语气、是否给理由）里校准判断。', limits: '被拒绝一次不代表什么；不要连续邀请。', delivery: '随意、轻松。' }
    ],
    pitfalls: [
      { say: '（也变冷淡，对他同样简短回复）', cost: '用冷淡回应冷淡，会把一个可能的误会变成稳定的对立，而你甚至还不知道原因。' },
      { say: '（在群里或当众）“小陈你最近是不是对我有意见？”', cost: '当众质问让对方被迫表态，通常得到的是防御而不是真话。' }
    ]
  });

  S({ id: 'r6', domain: 'read', topic: 'read', dims: { parties: 6, subtext: 3, power: 3, heat: 3 },
    title: { zh: '家庭聚餐上的暗线', en: 'The undercurrents at a family dinner' },
    setup: { zh: '春节家庭聚餐，七八个亲戚围坐一桌。几位长辈聊起你堂哥刚买的房子，话题一点点拐向你——桌下，你妈轻轻碰了你的脚。', en: 'At a family dinner with a table of relatives, elders praise your cousin’s new flat and the topic slowly turns toward you — under the table your mother taps your foot.' },

      ['妈妈', '（在桌下碰了碰你的脚）', '脸上还带着笑，没有看你'],
      ['堂哥', '“我也就是运气好，其实压力也大。”', '看向你，微微耸肩'],
      ['三姑', '“你呢？有什么打算？”', '全桌静了一下']

    prompt: '这场对话里各方在做什么？你怎么回应才对自己、对妈妈、对大家都比较体面？',
    signals: [
      { id: 'r6s1', type: 'face', layer: 'relation', beat: 0, text: '称赞堂哥的同时看你一眼：赞美里含有比较，话题正在铺垫。' },
      { id: 'r6s2', type: 'audience', layer: 'power', beat: 1, text: '二叔的“对吧？”：把个人问题变成大家的共识，让你不好反驳。' },
      { id: 'r6s3', type: 'body', layer: 'relation', beat: 2, text: '妈妈桌下碰脚：她在提醒你“小心/别硬碰”，也是在紧张——她担心你被评价，也担心场面。' },
      { id: 'r6s4', type: 'alliance', layer: 'relation', beat: 3, text: '堂哥的耸肩：他在向你示好、撇清“比较”，可能是潜在的盟友。' },
      { id: 'r6s5', type: 'timing', layer: 'subtext', beat: 4, text: '全桌静下来：这是一个被设计的“该你说了”的时刻，你的回应会被各方解读。' }
    ],
    veteran: [
      { say: { zh: '“我现在先把手头的事做扎实，等有了结果第一个跟三姑汇报。倒是堂哥，你得传授点买房的经验，我们都想听。”', en: '“I’m focusing on getting things right now and will report to you first when there’s news. Cousin, you should share your home-buying tips — we all want to hear.”' }, mech: ['boundary', 'saveFace', 'redirect'], why: '给长辈一个体面的交代，同时承接堂哥的示好，把焦点引回对方，不对抗也不透露细节。', limits: '语气不要敷衍；如果长辈继续追问，需要重复一次边界，再换话题。', delivery: '微笑、语速放缓，说完看向堂哥，自然地把话题交出去。' },
      { say: { zh: '（用玩笑承接）“三姑这是要给我下任务啊！我记下了，今年的 KPI 就这么定了。”', en: '(with humor) “Auntie is assigning me a target! Noted — that’s this year’s KPI.”' }, mech: ['humor', 'partial'], why: '用玩笑接住期待，不接受压力的框架，也让桌上的气氛放松。', limits: '对非常较真的长辈需要配合一句更认真的话。', delivery: '轻松、带笑。' },
      { say: { zh: '（私下对妈妈）“刚才你碰我，我懂你的意思。下次我们可以先说好，被问到这类问题，你希望我怎么回答？”', en: '(privately to Mom) “I got what you meant by the tap. Next time, how would you like me to handle those questions?”' }, mech: ['probe', 'nameFact'], why: '把无声的暗号变成可沟通的约定，减少下一次的猜测与紧张。', limits: '时间选在饭后、不被打扰的时候，不要当场争论。', delivery: '温和、合作，不带“你为什么总这样”的指责。' }
    ],
    pitfalls: [{ say: '“你们能不能别总拿我跟堂哥比？我怎么过是我自己的事！”', cost: '直接顶回去会让一桌人下不来台，妈妈也被置于尴尬的位置，你的态度反而成了话题。' }]

  S({ id: 'c1', domain: 'close', topic: 'intimacy', dims: { parties: 2, subtext: 2, power: 1, heat: 2 },
    title: { zh: '爽约之后又来借钱的朋友', en: 'A friend who flaked, then asks to borrow money' },
    setup: { zh: '好友小林这两个月爽约了你们三次约好的聚会，今天突然发消息：“最近手头有点紧，能借我 3000 吗？下个月还。”', en: 'Your friend Lin has flaked on three plans in two months. Today they text: “Money’s a bit tight, could I borrow 3000? I’ll repay next month.”' },
    timeline: [
      ['小林', '“最近手头有点紧，能借我 3000 吗？”', '晚上 10:20'],
      ['小林', '“下个月一发工资就还你。”', '1 分钟后追加'],
      ['小林', '“不方便也没事，我再想想别的办法。”', '语气变轻']
    ],
    prompt: '你怎么回应？',
    signals: [
      { id: 'c1s1', type: 'timing', layer: 'subtext', beat: 0, text: '深夜发来、先说借钱：对方在犹豫很久后才开口，说明这件事对他不轻松。' },
      { id: 'c1s2', type: 'wording', layer: 'subtext', beat: 1, text: '很快补上“下个月还”：他在预判你的顾虑，也说明他知道自己之前的行为不太让人放心。' },
      { id: 'c1s3', type: 'wording', layer: 'relation', beat: 2, text: '“不方便也没事”：给你留了退路，但也可能含着“我其实很需要”。' },
      { id: 'c1s4', type: 'unsaid', layer: 'subtext', beat: 0, text: '没有提到爽约、也没有说原因：你看不到他最近发生了什么，借钱背后的情况不明。' }
    ],
    veteran: [
      { say: { zh: '“谢谢你信任我开口。我先问一下：是遇到什么急事了吗？我想知道你现在的情况，再看我能怎么帮。”', en: '“Thanks for trusting me. What’s going on? I want to understand before I see how I can help.”' }, mech: ['curious', 'probe'], why: '先接住他的信任，再用关心的问题获取真实情况，而不是直接审问或直接答应。', limits: '如果对方不愿说，可以尊重，但这也会影响你的决定。', delivery: '温和、真诚，不带审判。' },
      { say: { zh: '“3000 我这边不太方便，但我可以借你 1000，不用着急还。我们先把你最紧的这块解决，好吗？”', en: '“3000 is too much for me, but I can lend 1000, no rush to repay. Let’s cover the tightest part first.”' }, mech: ['boundary', 'saveFace'], why: '用自己能承受的额度设边界，同时表达支持。清楚的数字比含糊的“再说吧”更尊重对方。', limits: '只借你真的能承受“收不回来”的数额。', delivery: '平静、直接，不要附加说教。' },
      { say: { zh: '“这次借不了，是我自己最近也紧。但上次几次约好没来我有点在意，等你缓过来我们好好聊聊，可以吗？”', en: '“I can’t this time — I’m tight too. I also felt a bit hurt about the missed plans; let’s talk when you’re okay.”' }, mech: ['boundary', 'nameFact'], why: '拒绝时诚实地提出一直没说的在意，但选在对方“缓过来”之后，避免在他求助时说教。', limits: '要真的约时间聊，否则会变成含糊的抱怨。', delivery: '真诚、不带指责。' }
    ],
    pitfalls: [
      { say: '“你之前放了我三次鸽子，现在好意思找我借钱？”', cost: '把旧账和借钱绑在一起，会让对方羞耻、关系受损，而你也没有解决真正的问题。' },
      { say: '（因为不好意思拒绝，直接转账 3000）', cost: '违背自己意愿的答应会在之后变成怨气，也可能让对方不再认真对待承诺。' }

      { say: '“你怎么了？是不是我做错了什么？你说话呀。”', cost: '追问会逼他在没有力气时解释，也把他的疲惫个人化为“跟你有关”。' }

  S({ id: 'c3', domain: 'close', topic: 'intimacy', dims: { parties: 2, subtext: 3, power: 1, heat: 2 },

    veteran: [

// 可选的 Claude 点评层。默认不启用；仅在设置了 API key 且用户点击按钮时才联网。
(function () {
  const { state, L } = window.SG;
  const URL = 'https://api.anthropic.com/v1/messages';

  const SYSTEM = `你是一位社交觉察教练，帮助用户通过情境演练提升对社交信号的敏感度、觉察自己的自动反应（autopilot），并学会刻意设计回应而不是 react。
原则：
- 你是"镜子"和教练，不是评委：不打分、不给"对/错"结论，不给用户贴人格标签。
- 先具体肯定（引用用户的原话），再指出盲区；每条判断都基于场景里的具体线索或用户写下的内容。
- 承认语境不确定：用"可能""如果……"，不要把推断说成事实。
- 对用户的第一反应，要解读它可能体现的自动模式与背后的需求，并与用户自己选的标签对照（一致或不同都可以，说明理由）。
- 点评设计版回应时，说明它对"对方"和"关系"的可能影响，并给出一个更自然、口语化的改写。
- 不推荐操控、羞辱或贬低对方的话术；若用户的回应有这类倾向，温和指出其代价。
- 语气温暖、具体、简洁。用与用户界面相同的语言回答（用户语言：{LANG}）。`;

  const REVIEW_SCHEMA = {
    type: 'object', additionalProperties: false,
    required: ['noticed_well', 'missed', 'autopilot_read', 'designs', 'experiment'],
    properties: {
      noticed_well: { type: 'array', items: { type: 'string' } },
      missed: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['signal', 'why_it_matters'], properties: { signal: { type: 'string' }, why_it_matters: { type: 'string' } } } },
      autopilot_read: { type: 'string' },
      designs: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['which', 'strengths', 'risks', 'rewrite'], properties: { which: { type: 'string' }, strengths: { type: 'string' }, risks: { type: 'string' }, rewrite: { type: 'string' } } } },
      experiment: { type: 'string' }
    }
  };
  const COUNTER_SCHEMA = {
    type: 'object', additionalProperties: false, required: ['reactions', 'takeaway'],
    properties: {
      reactions: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['which', 'reply', 'inner'], properties: { which: { type: 'string' }, reply: { type: 'string' }, inner: { type: 'string' } } } },
      takeaway: { type: 'string' }
    }
  };

  // 把场景 + 用户所写的一切整理成给模型的文本
  function context(s, F) {
    const T = window.TAX, t = window.SG.t;
    const tl = s.timeline.map((b, i) => `${i + 1}. ${b[0]}：${b[1]}${b[2] ? `（${b[2]}）` : ''}`).join('\n');
    const sigs = s.signals.map((g) => `- [${t(T.signals[g.type])}/${t(T.layers[g.layer])}] ${g.text}（用户自评：${F.marks[g.id] ? '注意到了' : '漏掉了'}）`).join('\n');
    const labels = F.labels.map((k) => t(T.autopilot[k])).join('、') || '（未选）';
    return `【场景】${t(s.setup)}\n【对话/线索】\n${tl}\n【用户需要回应的问题】${t(s.prompt) || '你怎么回应？'}\n
【标注信号及用户自评】\n${sigs}\n【用户自己写的“我注意到了什么”】${F.notice || '（空）'}\n
【用户的第一反应（限时原样）】${F.auto}\n【用户给它起的自动模式标签】${labels}\n【当时的身体/情绪】${F.feel || '（空）'}\n【被触发的需求/假设】${F.need || '（空）'}\n
【暂停四问】想要的结果：${F.pause[0] || '—'}；对方需要：${F.pause[1] || '—'}；长期关系：${F.pause[2] || '—'}；面子/权力：${F.pause[3] || '—'}\n【设计版 A】${F.r1 || '（未写）'}\n【设计版 B】${F.r2 || '（未写）'}`;
  }
  const sys = () => SYSTEM.replace('{LANG}', state.lang === 'en' ? 'English' : '中文');
  const TASKS = {
    review: '请对用户的这次练习给出镜子式点评（JSON）：noticed_well（用户捕捉得好的，引用其原话）；missed（用户漏掉的信号及它为什么重要）；autopilot_read（对第一反应的解读，并与用户自选标签对照）；designs（对设计版 A、B 各一项，which 填 "A"/"B"，未写的版本不要列；说明优点、风险与更自然的改写 rewrite）；experiment（一个下次可做的小实验）。',
    counter: '请扮演场景中的“对方”，分别对用户的第一反应（which 填 "first"）、设计版 A（"A"）、设计版 B（"B"）做出真实的口语化反应（reply，1–3 句），并写出对方此刻内心的真实想法（inner）；未写的版本不要列。最后给一句 takeaway：这几种回应带来的差异。'
  };

  const PLAIN = {
    review: '请对用户的这次练习给出镜子式点评，分成：1) 你捕捉得好的（引用原话）；2) 你可能漏掉的信号及原因；3) 对你第一反应的解读（并与用户自选标签对照）；4) 对设计版 A、B 各自的优点、风险和更自然的改写；5) 一个下次可做的小实验。',
    counter: '请扮演场景中的“对方”，分别对用户的第一反应、设计版 A、设计版 B 做出真实的口语化反应（1–3 句），并写出对方此刻内心的真实想法；最后一句总结这几种回应带来的差异。'
  };
  function errMsg(e) {
    if (e && e.kind) return e.msg;
    return L('网络请求失败（可能是断网，或当前预览环境不允许访问外网）。', 'Network request failed (offline, or this preview blocks outside requests).');
  }
  async function call(kind, s, F) {
    if (!state.aiKey) throw { kind: 'nokey', msg: L('请先在设置里填写 API key。', 'Add your API key in Settings first.') };
    const body = {
      model: state.aiModel || 'claude-opus-5-5', max_tokens: 4000, system: sys(),
      messages: [{ role: 'user', content: context(s, F) + '\n\n' + TASKS[kind] }],
      output_config: { effort: 'low', format: { type: 'json_schema', schema: kind === 'review' ? REVIEW_SCHEMA : COUNTER_SCHEMA } }
    };
    const res = await fetch(URL, { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': state.aiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify(body) });
    if (!res.ok) {
      const m = { 401: L('API key 无效或没有权限。', 'Invalid API key.'), 403: L('没有权限访问该模型。', 'No access to this model.'), 404: L('找不到该模型，请在设置里换一个。', 'Model not found — pick another in Settings.'), 429: L('请求太频繁或额度受限，请稍后再试。', 'Rate limited — try again shortly.') }[res.status]
        || (res.status >= 500 ? L('服务暂时不可用，请稍后重试。', 'Service temporarily unavailable.') : L('请求出错（' + res.status + '）。', 'Request failed (' + res.status + ').'));
      throw { kind: 'http', status: res.status, msg: m };
    }
    const data = await res.json();
    if (data.stop_reason === 'refusal') throw { kind: 'refusal', msg: L('模型拒绝了这次请求，请换种写法再试。', 'The model declined this request.') };
    if (data.stop_reason === 'max_tokens') throw { kind: 'trunc', msg: L('回复被截断了，请重试。', 'Reply was truncated — retry.') };
    const txt = (data.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('');
    try { return JSON.parse(txt); } catch (e) { throw { kind: 'parse', msg: L('没能解析点评结果，请重试。', 'Could not parse the reply — retry.') }; }
  }

  // 无 key 时的兜底：把同一份提示词复制出去，贴到任意 Claude 对话
  function promptText(kind, s, F) {
    return sys() + '\n\n' + context(s, F) + '\n\n' + PLAIN[kind];
  }

  window.SG.ai = { call, errMsg, promptText };
})();

          <div class="panel"><label>${L('当时身体/情绪的感受', 'Body / emotion in that moment')}<textarea id="feel" rows="2">${esc(F.feel)}</textarea></label>
          <label>${L('被触发的需求或假设（如：怕被否定、想被认可、想掌控…）', 'The need or assumption triggered (fear of rejection, wanting approval or control…)')}<textarea id="need" rows="2">${esc(F.need)}</textarea></label></div>
          <button class="btn" id="toRedesign">${L('下一步：刻意设计 →', 'Next: redesign →')}</button>`;
      }
      return h;
    }

    if (F.step === 2) {
      const q = [L('我真正想要的结果是什么？', 'What outcome do I actually want?'), L('对方此刻最需要什么？', 'What does the other person need right now?'), L('这段关系的长期考虑？', 'What matters for the long-term relationship?'), L('面子/权力上，谁需要被照顾？', 'Whose face or power needs care here?')];
      return head + `<div class="panel"><p class="muted">${L('你的第一反应', 'Your first reaction')}</p><p><b>${esc(F.auto)}</b></p></div>
        <h2>${L('暂停键', 'The pause button')}</h2>${q.map((x, i) => `<label>${x}<input data-p="${i}" value="${esc(F.pause[i])}"></label>`).join('')}
        <h2>${L('设计两个不同意图的回应', 'Design two responses with different intents')}</h2>
        <label>${L('设计版 A', 'Design A')}<textarea id="r1" rows="3">${esc(F.r1)}</textarea></label><label>${L('设计版 B', 'Design B')}<textarea id="r2" rows="3">${esc(F.r2)}</textarea></label>
        <button class="btn" id="toStudy">${L('下一步：看老手怎么做 →', 'Next: see how veterans do it →')}</button>`;
    }

    // step 3 Study
    return head + `<div class="panel cmp"><div><p class="muted">${L('第一反应', 'First reaction')}</p><p>${nl(F.auto)}</p></div>${F.r1 ? `<div><p class="muted">${L('设计 A', 'Design A')}</p><p>${nl(F.r1)}</p></div>` : ''}${F.r2 ? `<div><p class="muted">${L('设计 B', 'Design B')}</p><p>${nl(F.r2)}</p></div>` : ''}</div>
      ${aiPanel()}
      <h2>${L('老手的回应', 'How a veteran might respond')}</h2><p class="muted">${L('这些是示范思路，不是万能模板。重点看“机制”，然后用你自己的口吻说。', 'These are examples, not templates. Focus on the mechanism, then say it your way.')}</p>
      ${s.veteran.map((v) => `<div class="panel vet"><blockquote class="say">${esc(t(v.say))}</blockquote><div class="chips">${v.mech.map((k) => `<button class="chip ${state.toolbox.indexOf(k) >= 0 ? 'on' : ''}" data-tool="${k}" title="${L('点击收藏到工具箱', 'Click to save to toolbox')}">${state.toolbox.indexOf(k) >= 0 ? '★ ' : '☆ '}${esc(t(TAX.mechanisms[k]))}</button>`).join('')}</div>
        <p><b>${L('为什么有效：', 'Why it works: ')}</b>${esc(v.why)}</p><p><b>${L('边界/风险：', 'Limits: ')}</b>${esc(v.limits)}</p><p><b>${L('语气与时机：', 'Delivery: ')}</b>${esc(v.delivery)}</p></div>`).join('')}
      ${s.pitfalls.length ? `<h2>${L('看似聪明、容易翻车', 'Looks smart, often backfires')}</h2>${s.pitfalls.map((p) => `<div class="panel pit"><blockquote class="say">${esc(p.say)}</blockquote><p>${esc(p.cost)}</p></div>`).join('')}` : ''}
      <div class="panel"><b>${L('带走一件事', 'Take one thing away')}</b><p class="muted">${L('下次遇到类似情境，你会在哪一刻停半拍？', 'Next time something similar happens, where will you pause half a beat?')}</p></div>
      <a class="btn" href="#/library">${L('完成，回场景库', 'Done — back to library')}</a> <button class="btn ghost" id="again">${L('再练一次这个场景', 'Practice again')}</button>`;
  });

  window.SG.route('practice:bind', (args) => {
    const s = byId(args[0]); if (!s || !F) return;
    const rr = () => window.SG.rerender();
    const bindText = (sel, key) => { const el = $(sel); if (el) el.oninput = () => { F[key] = el.value; }; };
    if (F.step === 0) {
      bindText('#notice', 'notice');
      const b = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
      b('#more', () => { F.shown++; rr(); });
      b('#reveal', () => { F.notice = ($('#notice') || {}).value || F.notice; F.revealed = true; rr(); });
      $$('[data-m]').forEach((el) => { el.onclick = () => { const [id, v] = el.dataset.m.split(':'); F.marks[id] = v === '1'; rr(); }; });
      b('#toCatch', () => { F.step = 1; F.tStart = Date.now(); F.firstKey = null; rr(); });
    } else if (F.step === 1) {
      if (!F.autoDone) {
        const ta = $('#auto'), bar = $('#tbar'), total = state.timer * 1000;
        if (ta) { ta.focus(); ta.oninput = () => { F.auto = ta.value; if (F.firstKey == null) F.firstKey = Date.now() - F.tStart; }; }
        stop();
        F.timerId = setInterval(() => {
          const left = Math.max(0, total - (Date.now() - F.tStart));
          if (bar) bar.style.width = (left / total * 100) + '%';
          if (left === 0) { stop(); const m = $('#tmsg'); if (m) m.textContent = L('时间到——原样提交，别修改。', 'Time’s up — submit as is, no edits.'); }
        }, 100);
        $('#submitAuto').onclick = () => { const v = ta.value.trim(); if (!v) { ta.focus(); return; } F.auto = v; F.duration = Date.now() - F.tStart; F.autoDone = true; stop(); rr(); };
      } else {
        $$('[data-l]').forEach((el) => { el.onclick = () => { const k = el.dataset.l, i = F.labels.indexOf(k); if (i >= 0) F.labels.splice(i, 1); else F.labels.push(k); rr(); }; });
        bindText('#feel', 'feel'); bindText('#need', 'need');
        $('#toRedesign').onclick = () => { F.step = 2; rr(); };
      }
    } else if (F.step === 2) {
      $$('[data-p]').forEach((el) => { el.oninput = () => { F.pause[+el.dataset.p] = el.value; }; });
      bindText('#r1', 'r1'); bindText('#r2', 'r2');
      $('#toStudy').onclick = () => {
        if (!F.saved) {
          F.saved = true;
          F.sessId = String(Date.now());
          state.sessions.push({ id: F.sessId, sid: s.id, ts: Date.now(), noticed: Object.assign({}, F.marks), notice: F.notice,
            auto: { text: F.auto, labels: F.labels.slice(), feel: F.feel, need: F.need, latency: F.firstKey, duration: F.duration },
            redesign: { pause: F.pause.slice(), r1: F.r1, r2: F.r2 } });
          save();
        }
        F.step = 3; rr();
      };
    } else {
      $$('[data-tool]').forEach((el) => { el.onclick = () => { window.SG.toggleTool(el.dataset.tool); rr(); }; });

      const run = async (kind) => {
        const mine = F;
        mine.ai.loading[kind] = true; mine.ai.err[kind] = '';
        rr();
        try {
          mine.ai[kind] = await window.SG.ai.call(kind, s, mine);
          const sess = state.sessions.find((x) => x.id === mine.sessId);
          if (sess) { sess.ai = sess.ai || {}; sess.ai[kind] = mine.ai[kind]; save(); }
        } catch (e) { mine.ai.err[kind] = window.SG.ai.errMsg(e); }
        mine.ai.loading[kind] = false;
        if (F === mine && /^practice\//.test(window.SG.path())) rr();
      };
      const copy = async (kind) => {
        const txt = window.SG.ai.promptText(kind, s, F);
        try { await navigator.clipboard.writeText(txt); F.ai.manual = ''; alert(L('已复制，去 Claude 对话里粘贴即可。', 'Copied — paste it into a Claude chat.')); }
        catch (e) { F.ai.manual = txt; rr(); }
      };
      const bb = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
      bb('#aiReview', () => run('review')); bb('#aiCounter', () => run('counter'));
      bb('#cpReview', () => copy('review')); bb('#cpCounter', () => copy('counter'));
      $('#again').onclick = () => { F = fresh(s.id); rr(); };
    }
  });

  window.SG.onRoute.push((p) => { if (p.indexOf('practice/') !== 0) stop(); });
})();

SG.start();
// 仅在 https/localhost 下注册 Service Worker；file:// 或沙箱预览中静默跳过
try { if ('serviceWorker' in navigator && /^(https:|http:)$/.test(location.protocol) && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
</script>
</body>
</html>
